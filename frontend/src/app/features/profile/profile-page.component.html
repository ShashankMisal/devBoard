<section class="profile-page">
  <header class="profile-page__header">
    <p class="profile-page__eyebrow">Account</p>
    <h1 class="profile-page__title">Profile settings</h1>
    <p class="profile-page__description">Manage your DevBoard identity and account status.</p>
  </header>

  <form class="profile-page__panel" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (formError()) {
      <app-ui-state title="Profile could not be saved" [message]="formError()" variant="error" />
    }

    <div class="profile-page__meta">
      <span class="profile-page__badge profile-page__badge--role">
        <span class="profile-page__badge-label">Role</span>
        <span class="profile-page__badge-separator" aria-hidden="true"></span>
        <span class="profile-page__badge-value">{{ user()?.role }}</span>
      </span>
      <span
        class="profile-page__badge profile-page__badge--status"
        [class.profile-page__badge--active]="user()?.isActive"
        [class.profile-page__badge--inactive]="!user()?.isActive"
      >
        <span class="profile-page__badge-label">Status</span>
        <span class="profile-page__badge-separator" aria-hidden="true"></span>
        <span class="profile-page__badge-value">{{ user()?.isActive ? 'Active' : 'Inactive' }}</span>
      </span>
    </div>

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input matInput type="text" formControlName="name" autocomplete="name" />
      @if (getError('name')) {
        <mat-error>{{ getError('name') }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (getError('email')) {
        <mat-error>{{ getError('email') }}</mat-error>
      }
    </mat-form-field>

    <div class="profile-page__actions">
      <button mat-flat-button type="submit" [disabled]="isSubmitting()">Save profile</button>
      <button mat-button color="warn" type="button" [disabled]="isDeactivating()" (click)="confirmDeactivate()">
        Deactivate account
      </button>
    </div>
  </form>
</section>
