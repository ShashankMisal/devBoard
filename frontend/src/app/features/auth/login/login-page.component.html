<section class="auth-page">
  <header class="auth-page__header">
    <p class="auth-page__eyebrow">Welcome back</p>
    <h1 class="auth-page__title">Log in to DevBoard</h1>
    <p class="auth-page__description">Access your project workspace with your DevBoard account.</p>
  </header>

  <form class="auth-page__form" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    @if (formError()) {
      <p class="auth-page__error">{{ formError() }}</p>
    }

    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" autocomplete="email" />
      @if (getError('email')) {
        <mat-error>{{ getError('email') }}</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        [type]="isPasswordVisible() ? 'text' : 'password'"
        formControlName="password"
        autocomplete="current-password"
      />
      <button
        class="auth-page__password-toggle"
        mat-icon-button
        matSuffix
        type="button"
        [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
        [attr.aria-pressed]="isPasswordVisible()"
        (click)="togglePasswordVisibility()"
      >
        <span
          class="auth-page__password-eye"
          [class.auth-page__password-eye--hidden]="!isPasswordVisible()"
          aria-hidden="true"
        ></span>
      </button>
      @if (getError('password')) {
        <mat-error>{{ getError('password') }}</mat-error>
      }
    </mat-form-field>

    <div class="auth-page__actions">
      <a mat-button routerLink="/register">Create account</a>
      <button class="auth-page__submit" mat-flat-button type="submit" [disabled]="isSubmitting()">Log in</button>
    </div>
  </form>
</section>
